<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="{% block accent %}amber{% endblock %}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}EduHelp AI{% endblock %}</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="EduHelp AI" class="brand-logo">
        <span class="brand-name">EduHelp<em>AI</em></span>
      </div>
      <nav>
        <a href="/app" class="{{ 'active' if request.path == '/app' }}">Home</a>
        <a href="/chat" class="{{ 'active' if request.path == '/chat' }}">Chat with Notes</a>
        <a href="/quiz" class="{{ 'active' if request.path == '/quiz' }}">Quiz</a>
        <a href="/flashcards" class="{{ 'active' if request.path == '/flashcards' }}">Flashcards</a>
        <a href="/planner" class="{{ 'active' if request.path == '/planner' }}">Planner</a>
        <a href="/dashboard" class="{{ 'active' if request.path == '/dashboard' }}">Dashboard</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
        <span class="dot"></span> <span class="label">Night mode</span>
      </button>
      {% if session.user %}
      <div class="user-card">
        {% if session.user.picture %}
        <img src="{{ session.user.picture }}" alt="{{ session.user.name }}" class="user-avatar">
        {% endif %}
        <div class="user-info">
          <span class="user-name">{{ session.user.name }}</span>
          <a href="{{ url_for('logout') }}" class="user-logout">Sign out</a>
        </div>
      </div>
      {% endif %}
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
