{% extends "base.html" %}
{% block title %}Chat with Notes{% endblock %}
{% block accent %}violet{% endblock %}
{% block content %}
<div class="eyebrow">Ask your notes</div>
<h1>Chat with your notes</h1>

<div class="card">
  <div class="field">
    <label>Document</label>
    <select id="chat-doc">
      {% for doc_id, doc in docs.items() %}
        <option value="{{ doc_id }}">{{ doc.filename }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="chat-log" id="chat-log"></div>

  <div style="display:flex; gap:8px;">
    <input type="text" id="chat-input" placeholder="e.g. Explain Binary Tree">
    <button id="chat-send">Ask</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const log = document.getElementById("chat-log");
const input = document.getElementById("chat-input");

function addMessage(text, who, sourcePages) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  if (sourcePages && sourcePages.length) {
    const src = document.createElement("span");
    src.className = "source";
    src.textContent = "Source page(s): " + sourcePages.join(", ");
    div.appendChild(src);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function send() {
  const doc_id = document.getElementById("chat-doc").value;
  const question = input.value.trim();
  if (!doc_id) { addMessage("Upload a document first.", "ai"); return; }
  if (!question) return;

  addMessage(question, "user");
  input.value = "";
  addMessage("Thinking...", "ai");

  try {
    const data = await apiPost("/api/chat", { doc_id, question });
    log.lastChild.remove();
    addMessage(data.answer, "ai", data.source_pages);
  } catch (e) {
    log.lastChild.remove();
    addMessage("Error: " + e.message, "ai");
  }
}

document.getElementById("chat-send").addEventListener("click", send);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
{% endblock %}
