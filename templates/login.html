<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · EduHelp AI</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
<style>
  .login-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    padding: 24px;
  }
  .login-card {
    background: var(--paper, #fff);
    border: 1px solid var(--line, #e4ded4);
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.15);
  }
  .login-logo { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; margin-bottom: 18px; }
  .login-title { font-family: 'Fraunces', serif; font-size: 1.6rem; font-weight: 700; margin: 0 0 6px; }
  .login-title em { font-style: normal; color: var(--amber); }
  .login-sub { color: var(--ink-dim, #6b6459); font-size: 0.95rem; margin: 0 0 28px; }
  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px 18px;
    background: #fff;
    color: #1f1f1f;
    border: 1px solid #d7d3ca;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .google-btn:hover { box-shadow: 0 10px 24px -8px rgba(0,0,0,0.2); transform: translateY(-1px); }
  .google-btn svg { width: 20px; height: 20px; }
  .login-note { margin-top: 22px; font-size: 0.8rem; color: var(--ink-dim, #999); }
</style>
</head>
<body class="landing">

  <div class="aurora" aria-hidden="true">
    <span class="a1"></span>
    <span class="a2"></span>
    <span class="a3"></span>
    <span class="a4"></span>
    <span class="a5"></span>
  </div>

  <div class="login-shell">
    <div class="login-card">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="EduHelp AI" class="login-logo">
      <h1 class="login-title">EduHelp<em>AI</em></h1>
      <p class="login-sub">Sign in with your Gmail account to continue.</p>

      <a class="google-btn" href="{{ url_for('auth_google') }}">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.9 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 7.1 29.5 5 24 5 16.3 5 9.6 9.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.4 0 10.3-1.9 14-5.7l-6.5-5.5c-2 1.5-4.6 2.5-7.5 2.5-5.2 0-9.6-3.1-11.3-7.6l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.5 5.5C41.5 35.8 44 30.4 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        Sign in with Google
      </a>

      <p class="login-note">We only use your name and email to identify your account.</p>
    </div>
  </div>

</body>
</html>
